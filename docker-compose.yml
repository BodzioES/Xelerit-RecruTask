name: janusztrans

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-janusztrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janusztrans}
      POSTGRES_DB: ${POSTGRES_DB:-janusztrans}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-janusztrans} -d ${POSTGRES_DB:-janusztrans}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-janusztrans}:${POSTGRES_PASSWORD:-janusztrans}@db:5432/${POSTGRES_DB:-janusztrans}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-deploying-32chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      PROVIDER_EMAIL: ${PROVIDER_EMAIL:-provider@janusztrans.local}
      PROVIDER_PASSWORD: ${PROVIDER_PASSWORD:-provider123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      HANDOVER_ENCRYPTION_KEY: ${HANDOVER_ENCRYPTION_KEY:-dev-only-handover-key-change-me}
      RESOURCE_BUFFER_MINUTES: ${RESOURCE_BUFFER_MINUTES:-60}
      MAX_MOVING_HELPERS: ${MAX_MOVING_HELPERS:-4}
      SERVICE_AREA_RADIUS_KM: ${SERVICE_AREA_RADIUS_KM:-30}
      SERVICE_AREA_CENTER_LATITUDE: ${SERVICE_AREA_CENTER_LATITUDE:-54.4416}
      SERVICE_AREA_CENTER_LONGITUDE: ${SERVICE_AREA_CENTER_LONGITUDE:-18.5601}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
