[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janusztrans-backend"
version = "0.1.0"
description = "JanuszTrans API — van rental, transport and moving services MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0.36,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pyjwt>=2.10,<3.0",
    "httpx>=0.28,<1.0",
    "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI dependency injection uses function calls in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local `alembic/` directory would otherwise be treated as first-party.
known-third-party = ["alembic"]
